#version: "3.8"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    pull_policy: never
    container_name: ema_vwap_timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ema_vwap
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/init-timescaledb.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ema_vwap"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  ema-vwap-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ema_vwap_trading_daemon
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistent logs directory
      - ./logs:/app/logs
      # Mount application source code
      - ./src:/app/src
      # Mount entrypoint script
      - ./entrypoint.sh:/app/entrypoint.sh
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8080
      - IN_DOCKER=1
      # PostgreSQL connection
      - PG_HOST=timescaledb
      - PG_PORT=5432
      - PG_DATABASE=ema_vwap
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_SSL_MODE=disable
      # API key for load testing
      - API_KEY=test-load-test-key
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ && curl -f http://localhost:8080/api/paper/engine/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  timescaledb_data:
